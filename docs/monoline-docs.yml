# yaml-language-server: $schema=./node_modules/@chitrank2050/monoline-docs/schema.json
title: ask-widget docs
description: Install, configure and integrate the streaming React chat widget.
site: https://chitranklabs.github.io
base: /ask-widget/
cleanUrls: true
contentDirectory: ./content
assetsDirectory: ../assets
outDirectory: ./dist
stylesheet: /assets/theme.css
seo:
  titleTemplate: '%s | ask-widget docs'
