# =============================================================
# Documentation Deployment 📖
#
# Automatically builds and deploys Monoline Docs to GitHub Pages.
# Triggered on pushes to 'main' affecting documentation or manually.
# =============================================================

name: Documentation 📖

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup-bot/**'
      - 'tsconfig.app.json'
      - 'scripts/docs-deploy.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'assets/**'
  workflow_dispatch:

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docs 🌐
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure Authenticated Git 🔧
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}"

      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Documentation 🏗️
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_DOCS_ANALYTICS_TOKEN }}
        run: pnpm run docs:build

      - name: Deploy to GitHub Pages 🚀
        run: |
          git config user.name "chitrank-actions[bot]"
          git config user.email "actions@github.com"
          npx --yes gh-pages@6.3.0 -d docs/dist --nojekyll --cname docs.askwidget.chitrankagnihotri.com -m "docs: deploy automated build"
