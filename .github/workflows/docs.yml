# =============================================================
# Documentation Deployment 📖
#
# Automatically builds and deploys VitePress docs to GitHub Pages.
# Triggered on pushes to 'main' affecting documentation or manually.
# =============================================================

name: Documentation 📖

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-deploy.sh'
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docs 🌐
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: ./.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}

      - name: Configure Authenticated Git 🔧
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}"

      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      # Match the Meterplex "Transient Docs" pattern
      # Source stays at root, but CI copies it to docs/ for the build
      - name: Copy transient docs 📝
        run: |
          cp CHANGELOG.md docs/changelog.md
          if [ -f CODE_OF_CONDUCT.md ]; then cp CODE_OF_CONDUCT.md docs/code-of-conduct.md; fi

      - name: Build Documentation 🏗️
        run: pnpm run docs:build

      - name: Deploy to GitHub Pages 🚀
        run: |
          git config user.name "chitrank-actions[bot]"
          git config user.email "actions@github.com"
          npx gh-pages -d docs/.vitepress/dist -m "docs: deploy automated build"
