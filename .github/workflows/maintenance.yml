# =============================================================
# Weekly Maintenance - Dependency & Overrides Check
#
# This workflow runs every Sunday to proactively check if your
# workspace overrides are still necessary.
#
# How it works:
# 1. Removes the overrides block from pnpm-workspace.yaml
# 2. Runs pnpm install and OSV audit
# 3. If everything passes, it automatically opens a Pull Request
#    to remove the redundant overrides for you.
# =============================================================

name: Weekly Maintenance 🧹

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prune_overrides:
    name: Prune Redundant Overrides ✂️
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Remove overrides & update lockfile 🛠️
        id: check
        run: |
          if grep -q '^overrides:' pnpm-workspace.yaml; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'pnpm-workspace.yaml';
          const source = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, source.replace(/^overrides:\n(?:[ \t]+[^\n]*\n|[ \t]*\n)*/m, ''));
          NODE
            pnpm install --no-frozen-lockfile --prefer-offline
            pnpm build:lib
            pnpm docs:build
            pnpm --filter ask-widget-website build
            echo "has_overrides=true" >> "$GITHUB_OUTPUT"
          else
            echo "No workspace overrides found to prune."
            echo "has_overrides=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OSV Scanner 🔍
        if: steps.check.outputs.has_overrides == 'true'
        run: |
          curl -L https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pnpm-lock.yaml

      # App-authored PRs must trigger their own CI checks.
      - name: Create Bot Token 🤖🔑
        if: steps.check.outputs.has_overrides == 'true'
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request if redundant 🚀
        if: steps.check.outputs.has_overrides == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          add-paths: |
            pnpm-workspace.yaml
            pnpm-lock.yaml
          commit-message: 'chore(deps): prune redundant dependency overrides'
          branch: maintenance/prune-overrides
          assignees: chitrank2050
          title: 'chore(deps): prune redundant dependency overrides 🧹'
          body: |
            The weekly maintenance check has detected that your workspace dependency overrides are no longer necessary.
            Upstream packages have been updated and the security vulnerabilities previously mitigated by these overrides are now resolved in the base versions.
          labels: |
            dependencies
            maintenance
            automated-pr
