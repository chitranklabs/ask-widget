# =============================================================
# JSR Publication Lab 🦖
#
# Manually trigger this to test JSR publishing stability.
# This uses OIDC authentication (no tokens required if configured in JSR).
#
# Triggers:
#   - Manual dispatch
# =============================================================

name: 🦖 JSR Publication Lab

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing immutable release tag to recover (for example v0.7.0)'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write # Required for JSR OIDC publishing

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: jsr-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JSR 🚀
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Verify release source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="v${INPUT_VERSION#v}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then exit 1; fi
          git checkout --detach "$TAG"
          test "$(jq -r .version package.json)" = "${TAG#v}"
          test "$(jq -r .version jsr.json)" = "${TAG#v}"

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Library 🏗️
        run: pnpm run build:lib

      - name: Publish 📦
        run: deno publish
