# =============================================================
# JSR Publication Lab 🦖
#
# Manually trigger this to test JSR publishing stability.
# This uses OIDC authentication (no tokens required if configured in JSR).
#
# Triggers:
#   - Manual dispatch
# =============================================================

name: 🦖 JSR Publication Lab

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # Required for JSR OIDC publishing

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to JSR 🚀
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Sync Version 🔄
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Robust extraction: find the first version-like string (X.Y.Z)
          RAW_INPUT="$INPUT_VERSION"
          if [ -z "$RAW_INPUT" ]; then
            RAW_INPUT=$(jq -r .version package.json)
          fi

          # Extract only the semantic version part
          VERSION=$(echo "$RAW_INPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-.*)?' | head -1)

          if [ -z "$VERSION" ]; then
            echo "❌ Error: Could not extract valid version from: $RAW_INPUT"
            exit 1
          fi

          echo "Syncing JSR version to: $VERSION"
          jq ".version = \"$VERSION\"" jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json

      - name: Build Library 🏗️
        run: pnpm run build:lib

      - name: Publish 📦
        run: npx jsr publish --allow-dirty
