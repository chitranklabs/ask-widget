name: Release 2 - Finalize Tag 🏷️

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: [package.json, jsr.json, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to recover (for example v0.7.0)
        required: true
        type: string
      target:
        description: Release destination to recover
        type: choice
        options: [all, npm, jsr, github]
        default: all

permissions:
  contents: read
concurrency:
  group: release-finalize
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Validate release and prepare tag
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      (startsWith(github.event.pull_request.head.ref, 'release/v') || startsWith(github.event.pull_request.head.ref, 'chore/release-v'))) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_sha: ${{ steps.vars.outputs.release_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Resolve immutable release source
        id: vars
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$RELEASE_BRANCH}"
          RAW="${RAW#release/}"
          RAW="${RAW#chore/release-}"
          TAG="v${RAW#v}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid release version: $RAW"
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Recovery requires an existing tag. Rerun the original merged-PR tag job if creation failed."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ -z "$INPUT_VERSION" ] && [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Existing release tag points to a different commit"
              exit 1
            fi
            git checkout --detach "$TAG"
          fi
          VERSION="${TAG#v}"
          if [ "$(jq -r .version package.json)" != "$VERSION" ] || [ "$(jq -r .version jsr.json)" != "$VERSION" ]; then
            echo "::error::Release tag, package.json and jsr.json versions must match"
            exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify library
        run: |
          pnpm test
          pnpm typecheck
          pnpm build:lib
          npm pack --dry-run
      - name: Create bot token
        id: bot
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ steps.vars.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  publish-npm:
    name: Publish npm or recover
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.release_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build:lib
      - name: Check existing registry version
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry lookup failed: ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          NODE
      - name: Verify provenance source
        if: steps.registry.outputs.published != 'true'
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Run a new npm publication from the release tag so provenance identifies the same commit."
            exit 1
          fi
      - name: Publish package with provenance
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-jsr:
    name: Publish JSR or recover
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'jsr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.release_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Publish source package
        run: deno publish

  github-release:
    name: Create or restore GitHub release
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build.outputs.release_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create bot token
        id: bot
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --current --strip all --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "Release already exists"
          else
            FLAGS=()
            if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "ask-widget $TAG" --notes-file release-notes.md "${FLAGS[@]}"
          fi
