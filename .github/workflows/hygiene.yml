# =============================================================
# Hygiene: Metadata Validation 🌊
#
# Enforces branch naming and PR title standards.
# Powered by git-hygiene.
# =============================================================

name: Hygiene 🌊

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    name: Validate Metadata 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 100 # Needed to see history for commit validation

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate PR Title 🏷️
        uses: chitranklabs/git-hygiene@22783c72540d66e1b851295d1961c19b6db81856 # v0.4.12
        with:
          command: 'title'
          value: ${{ github.event.pull_request.title }}

      - name: Validate Branch Name 🌿
        uses: chitranklabs/git-hygiene@22783c72540d66e1b851295d1961c19b6db81856 # v0.4.12
        with:
          command: 'branch'
          value: ${{ github.event.pull_request.head.ref }}
