# =============================================================
# Hygiene: Metadata Validation 🌊
#
# Enforces branch naming and PR title standards.
# Powered by git-hygiene.
# =============================================================

name: Hygiene 🌊

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    name: Validate Metadata 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 100 # Needed to see history for commit validation

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate PR Title 🏷️
        uses: chitranklabs/git-hygiene@48c2a75c76ae4b3ae0875d2bed55b8047188e66c # v0.5.1
        with:
          command: 'title'
          value: ${{ github.event.pull_request.title }}

      - name: Validate Branch Name 🌿
        uses: chitranklabs/git-hygiene@48c2a75c76ae4b3ae0875d2bed55b8047188e66c # v0.5.1
        with:
          command: 'branch'
          value: ${{ github.event.pull_request.head.ref }}
