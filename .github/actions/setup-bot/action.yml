# =============================================================
# Setup Chitrank Bot Action
#
# Centralized action to generate a GitHub App installation
# access token. This allows workflows to perform actions
# (like creating PRs or pushing tags) that trigger other
# workflows, bypassing the GITHUB_TOKEN restrictions.
#
# Usage:
#   uses: $/.github/actions/setup-bot
#   with:
#     client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
#     private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
# =============================================================

name: 'Setup Chitrank Bot'
description: 'Generates a GitHub App token for automated tasks'
inputs:
  client-id:
    description: 'The GitHub App Client ID'
    required: true
  private-key:
    description: 'The GitHub App Private Key'
    required: true
  permission-contents:
    description: Repository contents permission
    required: true
  permission-pull-requests:
    description: Pull request permission
    required: false
  permission-issues:
    description: Issue permission for labels and assignees
    required: false
  permission-workflows:
    description: Workflow permission when creating release tags
    required: false
outputs:
  token:
    description: 'The generated GitHub App token'
    value: ${{ steps.generate_token.outputs.token }}
runs:
  using: 'composite'
  steps:
    - name: Create Bot Token 🤖🔑
      id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-workflows: ${{ inputs.permission-workflows }}
