packages:
  - '.'
  - 'website'
  - 'docs'

peerDependencyRules:
  ignoreMissing:
    - vite
    - react
    - react-dom
    - '@types/react'
    - '@types/react-dom'
  allowedVersions:
    vite: 8.0.0
    react: 19.2.4
    react-dom: 19.2.4
    '@types/react': 19.2.14
    '@types/react-dom': 19.2.3
engineStrict: false
allowBuilds:
  esbuild: true
  lefthook: true
  '@swc/core': false
minimumReleaseAgeExclude:
  - '@chitrank2050/monoline-docs@0.3.0'
  - '@chitrank2050/monoline-ui@0.5.2'

# Patched transitive versions until Markdown tooling updates its dependency ranges.
overrides:
  'markdownlint-cli>js-yaml': '^5.4.1'
  'markdownlint-cli>smol-toml': '^1.9.0'
  'micromark-extension-math>katex': '^0.18.2'
